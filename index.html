<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>The AI Advantage - Found It Marketing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                orange: '#ff6600',
                black: '#050505',
                dark: '#0a0a0a',
                gray: '#333333',
              }
            },
            fontFamily: {
              sans: ['Lato', 'sans-serif'],
              serif: ['Playfair Display', 'serif'],
              inter: ['Inter', 'sans-serif'],
            },
            animation: {
              'grid-flow': 'grid-flow 20s linear infinite',
            },
            keyframes: {
              'grid-flow': {
                '0%': { transform: 'translateY(0)' },
                '100%': { transform: 'translateY(50px)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #000;
        color: #e2e8f0;
        overflow: hidden;
        overscroll-behavior-y: none; 
      }
      
      .perspective-container {
        perspective: 1000px;
        overflow: hidden;
      }
      .perspective-grid {
        position: absolute;
        width: 200%;
        height: 200%;
        bottom: -50%;
        left: -50%;
        background-image: 
          linear-gradient(to right, rgba(255, 102, 0, 0.1) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255, 102, 0, 0.1) 1px, transparent 1px);
        background-size: 50px 50px;
        transform: rotateX(60deg);
        transform-origin: 50% 0;
        mask-image: linear-gradient(to bottom, transparent 0%, black 40%, black 100%);
        -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 40%, black 100%);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",

    "react": "https://esm.sh/react@^19.2.4",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "framer-motion": "https://esm.sh/framer-motion@^12.33.0"
  }
}
</script>

</head>

</html>
